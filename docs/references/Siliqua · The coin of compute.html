<style>
:root{--bg:#0A0A0B;--bg2:#121214;--tx:#D8D4CC;--dim:#8C8880;--ln:#26262A;--em:#E0662B;--em2:#B84E1E;--up:#6FA383;--dn:#C0675B;--hd:"Archivo","Helvetica Neue",Arial,sans-serif;--mo:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--pad:clamp(20px,5vw,64px);box-sizing:border-box}

a{color:inherit}a:focus-visible,button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--em);outline-offset:3px}[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}

td{padding:14px 16px;border-bottom:1px solid var(--ln);white-space:nowrap}tr:last-child td{border:0}
tbody tr:hover{background:var(--bg2)}td a{text-decoration:none;font-weight:500}td a:hover{color:var(--em)}
.up{color:var(--up)}.dn{color:var(--dn)}

.c-live,.c-open,.c-settled{color:var(--up)}.c-stale,.c-settling{color:var(--em)}.c-insuf,.c-void,.c-closed{color:var(--dn)}.c-nl{color:var(--tx)}
.leg{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--dim)}
.arch{display:grid;grid-template-columns:1fr minmax(300px,440px) 1fr;gap:24px;align-items:center;margin-top:36px}
.an{border-left:2px solid var(--em);padding:4px 0 4px 14px}.an b{font:500 12px var(--mo);letter-spacing:.16em;color:var(--tx)}.an p{margin:4px 0 0;font-size:13px}
.disc{height:46px;margin:-6px 0;transform:translateX(var(--x,0));background:linear-gradient(#3a3a3e,#1a1a1c);border:1px solid #555;border-radius:50%/50%;box-shadow:0 0 18px rgba(224,102,43,.25)}

.pb{display:flex;height:14px;margin:12px 0;background:var(--ln)}.pb i{display:block;height:100%;transition:width .4s}.pb .y{background:var(--em)}.pb .n{background:#5a5a60}
.nl{display:inline-block;border:2px solid var(--em);color:var(--em);padding:8px 14px;font:900 16px var(--hd);text-transform:uppercase;letter-spacing:.06em;margin:12px 0}

.legal{color:var(--dim);font-size:12px;margin-top:32px;max-width:90ch}.fb{display:flex;gap:20px;flex-wrap:wrap;border-top:1px solid var(--ln);margin-top:24px;padding-top:20px;font-size:12px;color:var(--dim)}.fb a{margin-right:4px}
dialog{background:var(--bg2);color:var(--tx);border:1px solid var(--ln);padding:28px;width:min(420px,92vw)}dialog::backdrop{background:rgba(0,0,0,.75)}
.opt{display:block;width:100%;text-align:left;margin:10px 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:#0A0A0B;padding:12px 20px;font-size:13px;z-index:50;display:none;max-width:90vw}
.in{background:var(--bg);border:1px solid var(--ln);color:var(--tx);font:16px var(--mo);padding:12px 14px;width:100%;max-width:280px}
.ban{border:1px solid var(--em);padding:14px 18px;color:var(--tx);background:rgba(224,102,43,.08);margin:12px 0}
.sk{height:16px;background:linear-gradient(90deg,var(--ln),#33333a,var(--ln));background-size:200% 100%;animation:sh 1.6s infinite;margin:8px 0}@keyframes sh{to{background-position:-200% 0}}
.sw{display:inline-block;width:100%;height:56px;border:1px solid var(--ln)}
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}.rv.in2{opacity:1;transform:none}
@media(max-width:860px){nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--bg);padding:16px var(--pad);border-bottom:1px solid var(--ln)}nav.open{display:flex}#mt{display:block;margin-left:auto}header>.btn.w{display:none}
.hero,.arch,.g2,.g4,.fg{grid-template-columns:1fr}.g4>div{border-right:0;border-bottom:1px solid var(--ln)}.spec div{padding:12px 10px}.hero{min-height:0}}
@keyframes up{from{opacity:0;transform:translateY(22px)}}@keyframes gw{from{clip-path:inset(0 100% 0 0)}}@keyframes tp{to{transform:translateX(-50%)}}
.hero>div:first-child>*{animation:up .8s cubic-bezier(.2,.7,.2,1) both}.hero>div:first-child>:nth-child(2){animation-delay:.1s}.hero>div:first-child>:nth-child(3){animation-delay:.25s}.hero>div:first-child>:nth-child(4){animation-delay:.4s}.spec div{animation:up .8s .5s both}
.rv.in2 .bar div{animation:gw 1.1s cubic-bezier(.2,.7,.2,1) both}.rv.in2 .bar div:nth-child(2){animation-delay:.12s}.rv.in2 .bar div:nth-child(3){animation-delay:.24s}.rv.in2 .bar div:nth-child(4){animation-delay:.36s}.rv.in2 .bar div:nth-child(5){animation-delay:.48s}
.rv.in2 tbody tr,.rv.in2 .g4>div{animation:up .6s both}tbody tr:nth-child(2),.g4>div:nth-child(2){animation-delay:.08s}tbody tr:nth-child(3),.g4>div:nth-child(3){animation-delay:.16s}tbody tr:nth-child(4),.g4>div:nth-child(4){animation-delay:.24s}tbody tr:nth-child(5){animation-delay:.32s}
.tape{overflow:hidden;border-bottom:1px solid var(--ln);background:var(--bg);padding:12px 0}.tape>div{display:flex;width:max-content;animation:tp 45s linear infinite;font:500 12px var(--mo);letter-spacing:.14em;color:var(--dim);white-space:nowrap}.tape span{margin:0 28px}.tape:hover>div{animation-play-state:paused}
#stk,#pls{width:100%}#stk{aspect-ratio:1/1.15}#pls{aspect-ratio:4/3}#stk canvas,#pls canvas{display:block;width:100%!important;height:100%!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.ch{position:relative;border:1px solid var(--ln);background:var(--bg)}.tt{position:absolute;top:8px;background:var(--bg2);border:1px solid var(--ln);padding:4px 8px;font-size:12px;pointer-events:none;white-space:nowrap}pre{background:var(--bg);border:1px solid var(--ln);padding:16px;overflow-x:auto;font-size:13px;margin:0 0 10px}.dim{color:var(--dim)}[hidden]{display:none!important}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}main,footer,.band,.strip{position:relative;z-index:1}
.pg{background:radial-gradient(ellipse at 50% 15%,rgba(10,10,11,.82),rgba(10,10,11,.62))}main>section+section{background:rgba(10,10,11,.62)}.band{background:rgba(10,10,11,.5)}
#stk{transform:translateX(7%)}@media(max-width:860px){#stk{transform:none}}
footer{background:var(--bg)}
</style>

<script>
(function(){

/* Sample data mirrors the future /v1 API shapes; all values are deterministic. */

function series(seed,start,n,vol){var r=rng(seed),v=start,a=[];for(var i=0;i<n;i++){v*=1+(r()-.5)*vol;a.push(v)}return a}
var DATA={
 index:[
  {id:"GRI-H100",route:"gpu-h100",gpu:"H100",value:2.41,c24:0.6,c7:4.8,valid:11,updated:"2026-11-21 08:00 UTC",status:"LIVE",s:series(11,2.30,42,.03)},
  {id:"GRI-H200",route:"gpu-h200",gpu:"H200",value:3.18,c24:-0.4,c7:-1.9,valid:8,updated:"2026-11-21 08:00 UTC",status:"LIVE",s:series(12,3.24,42,.03)},
  {id:"GRI-B200",route:"gpu-b200",gpu:"B200",value:5.92,c24:0,c7:2.2,valid:6,updated:"2026-11-21 01:00 UTC",status:"STALE",s:series(13,5.80,42,.02)},
  {id:"GRI-A100",route:"gpu-a100",gpu:"A100",value:1.27,c24:-0.2,c7:-3.1,valid:9,updated:"2026-11-21 08:00 UTC",status:"LIVE",s:series(14,1.31,42,.03)},
  {id:"GRI-4090",route:"gpu-4090",gpu:"RTX 4090",value:0.39,c24:0,c7:0,valid:3,updated:"2026-11-20 14:00 UTC",status:"INSUFFICIENT SOURCES",s:series(15,0.39,42,.01)}],
 cmi:{date:"2026-11-20",bps:[["AGENTS",3120],["DEPIN",2540],["INFER",1760],["ZKPROVE",1480],["OTHER",1100]]},
 market:{q:"Will GRI-H100 settle above $2.50 on Friday?",pyes:6200,pno:3800,close:"2026-11-25 00:00 UTC",status:"NOT LIVE"},
 roadmap:[["Data","LIVE","Gate: 30 days of data, no gap over 6 hours"],["On-chain oracle","NOT LIVE","Gate: 14 days of operator spread under tolerance"],["Compute Mindshare Index","NOT LIVE","Gate: 500-post labeled test set documented"],["Markets","NOT LIVE","Gate: legal review and contract audit"]]
};
var CHIP={LIVE:["●","live","Published this hour with enough valid sources."],STALE:["▲","stale","No fresh print. Last value is shown and marked."],"INSUFFICIENT SOURCES":["■","insuf","Fewer than 5 valid sources after outlier filter. Not published."],OPEN:["●","open","Accepting positions."],CLOSED:["◐","closed","Closed. TWAP window running."],SETTLING:["◐","settling","Settlement can be called."],SETTLED:["●","settled","Paid out."],VOID:["■","void","Cancelled. Funds refundable."],"NOT LIVE":["○","nl","Opens after legal review and contract audit."]};
function chip(s){var c=CHIP[s];return '<span class="chip c-'+c[1]+'" title="'+c[2]+'" tabindex="0">'+c[0]+' '+s+'</span>'}
var SD='<span class="tag">SAMPLE DATA</span>';
function pct(v){return v===0?"0.0%":(v>0?"▲ +":"▼ ")+Math.abs(v).toFixed(1)+"%"}
function cl(v){return v>0?"up":v<0?"dn":""}
function spark(a,w,h){var mn=Math.min.apply(0,a),mx=Math.max.apply(0,a),p=a.map(function(v,i){return(i/(a.length-1)*w).toFixed(1)+","+(h-(v-mn)/(mx-mn||1)*h).toFixed(1)}).join(" ");return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="7-day trend, from '+a[0].toFixed(2)+' to '+a[a.length-1].toFixed(2)+' USD"><polyline points="'+p+'" fill="none" stroke="#D8D4CC" stroke-width="1.5"/></svg>'}
function $(s,r){return(r||document).querySelector(s)}
function toast(m){var t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display="none"},2600)}

/* ---------- Pages ---------- */
function hero(){var g=DATA.index[0];return '<section><div class="hero"><div><p class="lb"><b>■</b> GRI / CMI · ON-CHAIN COMPUTE INDEXES</p><h1 tabindex="-1">The coin<br>of compute<i>.</i></h1><p style="margin-top:24px;font-size:18px">Open, recomputable indexes for GPU rental prices and compute narratives, published on-chain. Trade the price of a GPU hour.</p><div class="cta"><a class="btn p" href="#home" data-go="idx">Explore the indexes →</a><a class="btn" href="#methodology">Read the methodology</a></div></div><div id="coin" role="img" aria-label="Silver siliqua coin, slowly rotating"></div></div>'+
'<div class="spec"><div><span class="lb">GRI-H100 · USD / GPU-hr</span><b>$'+g.value.toFixed(2)+'</b></div><div><span class="lb">7-day change</span><b class="'+cl(g.c7)+'">'+pct(g.c7)+'</b></div><div><span class="lb">Valid sources</span><b>'+g.valid+' / 5 min</b></div></div><p class="lb" style="margin:16px 0 0">'+SD+'</p></section>'}
function tape(){var s='<span>SAMPLE DATA</span>'+DATA.index.map(function(d){var ok=d.status!=="INSUFFICIENT SOURCES";return '<span>'+d.id+' '+(ok?'$'+d.value.toFixed(2):'n/a')+' <i class="'+cl(d.c24)+'" style="font-style:normal">'+pct(d.c24)+'</i></span>'}).join("");return '<div class="tape" aria-hidden="true"><div>'+s+s+'</div></div>'}
function arch(){var L=[["SOURCES","At least 5 providers per GPU class"],["OPERATORS","2 of 3 signatures required"],["ORACLE","Median stored on-chain"],["MARKETS","Settles on a 24-hour TWAP"]];
return '<section class="rv"><div class="sec lb">INDEX ARCHITECTURE</div><h2>One index.<br>Four layers of proof<i>.</i></h2><div class="arch"><div class="stack">'+[0,2].map(function(i){return '<div class="an" style="text-align:left"><b>'+L[i][0]+'</b><p>'+L[i][1]+'</p></div>'}).join("")+'</div><div id="stk" role="img" aria-label="Four coin layers that separate as you scroll: sources, operators, oracle, markets"></div><div class="stack">'+[1,3].map(function(i){return '<div class="an"><b>'+L[i][0]+'</b><p>'+L[i][1]+'</p></div>'}).join("")+'</div></div><p style="margin-top:36px">A median ignores one provider that lists a wild price. An average would follow it. Outliers are dropped first, then the median of the rest is published.</p></section>'}
function ticker(){return '<section class="rv" id="idx"><div class="sec lb">LIVE INDEXES</div><h2>The price of a GPU hour<i>.</i></h2><p class="lb">'+SD+'</p><div class="tw"><table><caption>GPU Rent Index, all classes</caption><thead><tr><th>Index</th><th>Value (USD/hr)</th><th>24h</th><th>7d</th><th>Trend</th><th>Valid sources</th><th>Updated</th><th>Status</th></tr></thead><tbody>'+
