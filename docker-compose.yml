services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: siliqua
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: siliqua
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied only when the data volume is empty. To re-apply: docker compose down -v
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siliqua -d siliqua"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
